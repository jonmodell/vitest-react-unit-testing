name: model-eval

# Show the chosen model in the Actions run list (e.g. "model-eval · gpt-5.3-codex · jonmodell")
# instead of the generic workflow name. `inputs.model` is available at dispatch time.
run-name: model-eval · ${{ inputs.model }} · ${{ github.actor }}

# Produces tests with the GitHub Copilot CLI (agent mode), then grades them. This runs Copilot
# under your account's allowance, so it is locked to you alone:
#   - workflow_dispatch only (never on pull_request) — only accounts with write access can start it
#   - `if: github.actor == 'jonmodell'` — only you, even if collaborators are added
#
# NO personal access token: as of 2026-07, the Copilot CLI in Actions authenticates with the
# built-in GITHUB_TOKEN via the `copilot-requests: write` permission below.
# (The Copilot CLI install + non-interactive invocation are marked TODO — verify against its docs.)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the Copilot CLI"
        type: choice
        default: auto
        # Curated dropdown of Copilot CLI model ids AVAILABLE to this account (from `copilot` → /models,
        # 2026-08). Actions can't populate a dispatch dropdown dynamically, so it's hand-maintained.
        # Slug convention is confirmed from the CLI's own "Unavailable" list (gpt-5.6-sol, gpt-5.5,
        # claude-fable-5): lowercase, dot for version, dash for suffix — so `GPT-5.6 Terra` → gpt-5.6-terra.
        # NOT available on this account (excluded): the whole Opus family, gpt-5.5, gpt-5.6-sol,
        # claude-fable-5. An unavailable/typo pick fails the run loudly (the eval exits 3). Re-run /models
        # and refresh this list as availability changes.
        options:
          - auto
          - gpt-5.6-terra
          - gpt-5.6-luna
          - gpt-5.4
          - gpt-5.3-codex
          - claude-sonnet-5
          - claude-sonnet-4.6
          - claude-sonnet-4.5
          - claude-haiku-4.5
          - gemini-3.7-flash
          - gemini-3.1-pro
          - grok-4.6

permissions:
  contents: write # push the run to the eval-results dashboard branch
  copilot-requests: write # lets the built-in GITHUB_TOKEN make Copilot requests — no PAT needed

jobs:
  model-eval:
    if: github.actor == 'jonmodell' # only you can run the credentialed job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install vitest sandbox
        working-directory: evals/harness/sandbox
        run: npm install --no-audit --no-fund

      - name: Install Copilot CLI
        run: npm install -g @github/copilot # provides the `copilot` binary (confirm this matches how you installed it)

      - name: Run model eval
        id: eval
        working-directory: evals/harness/sandbox
        env:
          # Copilot CLI reads COPILOT_GITHUB_TOKEN | GH_TOKEN | GITHUB_TOKEN (in that order).
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
        # Uses the built-in `copilot` provider (copilot --allow-all-tools -p "<prompt>"). VERIFY the
        # flag names against `copilot --help` — adjust the preset in evals/harness/run.mjs if needed.
        # Capture the exit code instead of failing here: exit 1 = a real graded result (some cases red)
        # which we still publish; exit 3 = producer/config failure (bad model id, CLI missing) which
        # the final step turns into a job failure and which we do NOT publish.
        run: |
          set +e
          node ../run.mjs --agent --provider copilot --model "$MODEL" --out ./eval-report
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize
        if: always()
        working-directory: evals/harness/sandbox
        run: |
          if [ -f eval-report/report.json ]; then
            node -e '
              const r = require("./eval-report/report.json");
              const rows = r.results.map(x => `| ${x.id} | ${x.unit} | ${x.pass ? "✅" : "❌"} |`).join("\n");
              console.log(`### model eval — ${r.model} — ${r.summary.passed}/${r.summary.total} passed\n\n${r.producerVersion}\n\n| Case | Focus | Result |\n|--|--|--|\n${rows}\n`);
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ inputs.model }}: no report (producer failed — check the run log)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-report
          path: evals/harness/sandbox/eval-report

      # Publish to the Pages dashboard — but ONLY a real result. Skip on a producer failure (exit 3)
      # so a bad-model run can't pollute the dashboard with a bogus 0/N.
      - name: Publish to dashboard
        if: always() && steps.eval.outputs.exit_code != '3'
        continue-on-error: true
        uses: ./.github/actions/publish-dashboard
        with:
          report-dir: evals/harness/sandbox/eval-report
          token: ${{ github.token }}

      # Fail the run on a producer/model error, so an unavailable model id (or a broken/unauthenticated
      # CLI) is a RED run, not a green one with 0/N. A real graded result (exit 1) stays green.
      - name: Fail on producer/model error
        if: steps.eval.outputs.exit_code == '3'
        run: |
          echo "::error::Model '${{ inputs.model }}' produced no tests — likely not a valid Copilot model id, or the CLI is missing/unauthenticated. Pick a supported model from the dropdown."
          exit 1

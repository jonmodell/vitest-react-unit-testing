name: skill-evals

# Runs the skill's eval harness across a matrix of GitHub Models. No third-party API keys — the
# built-in GITHUB_TOKEN + `models: read` is all that's needed. Each job produces tests with one
# model, grades them (vitest sandbox), and uploads report.json + report.html.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "SKILL.md"
      - "references/**"
      - "scripts/**"
      - "evals/**"
      - ".github/workflows/evals.yml"

permissions:
  contents: read
  models: read # enables GitHub Models inference via the built-in GITHUB_TOKEN

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Use exact ids from your GitHub Models catalog (https://github.com/marketplace/models).
        model:
          - openai/gpt-4o-mini
          - openai/gpt-4o
          - meta/Llama-3.3-70B-Instruct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vitest sandbox
        working-directory: evals/harness/sandbox
        run: npm install --no-audit --no-fund

      - name: Run evals — ${{ matrix.model }}
        working-directory: evals/harness/sandbox
        continue-on-error: true # comparison run: a weak model failing shouldn't fail the workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../run.mjs --agent --provider github --model "${{ matrix.model }}" --out ./eval-report

      - name: Summarize
        if: always()
        working-directory: evals/harness/sandbox
        run: |
          if [ -f eval-report/report.json ]; then
            node -e '
              const r = require("./eval-report/report.json");
              const rows = r.results.map(x => `| ${x.id} | ${x.unit} | ${x.pass ? "✅" : "❌"} |`).join("\n");
              console.log(`### ${r.provider} · ${r.model}\n\n**${r.summary.passed}/${r.summary.total} passed** — ${r.producerVersion}\n\n| Case | Focus | Result |\n|--|--|--|\n${rows}\n`);
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.model }}: no report (inference failed — check the run log)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ strategy.job-index }}
          path: evals/harness/sandbox/eval-report
